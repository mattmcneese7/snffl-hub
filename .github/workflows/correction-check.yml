name: correction check

on:
  schedule:
    # Wednesday and Thursday mornings Central, per Brief Section 3.
    - cron: '0 14 * * 3,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # No Claude call here: this compares numbers. A queued retraction is
      # written by the next week's issue.
      - name: Compare finals against what was published
        env:
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
        run: node scripts/correction-check.ts

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rag
          if git diff --cached --quiet; then
            echo "no corrections"
          else
            git commit -m "Stat corrections"
            git push
          fi
