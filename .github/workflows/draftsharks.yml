name: draftsharks rankings

on:
  schedule:
    # Central daylight time. Tuesday and Wednesday afternoon catch the weekly
    # boards once DraftSharks publishes them, Thursday morning catches the week's
    # injury news before the first kickoff, and Sunday morning the inactives
    # talk before the noon slate.
    - cron: '0 20 * * 2'
    - cron: '0 20 * * 3'
    - cron: '0 15 * * 4'
    - cron: '0 15 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draftsharks
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Pull DraftSharks rest of season and weekly rankings
        run: node scripts/draftsharks-pull.ts

      - name: Commit rankings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draftsharks.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "DraftSharks rankings refresh"
            git pull --rebase
            git push
          fi
