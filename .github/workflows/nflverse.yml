name: nflverse usage

on:
  schedule:
    # 11:00 UTC, 6:00 AM Central daylight time. nflverse rebuilds its weekly
    # player stats and snap counts overnight, so this picks up Sunday and
    # Monday games the morning after.
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nflverse
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Pull nflverse weekly usage and snap counts
        run: node scripts/nflverse-pull.ts

      - name: Commit usage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nflverse-2026.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "nflverse usage refresh"
            git pull --rebase
            git push
          fi
