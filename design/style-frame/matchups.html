<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SNFFL Matchups, style frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./colors.css">
<link rel="stylesheet" href="./frame.css">
</head>
<body>
<main class="snffl-page" id="snffl-matchups"></main>
<script src="./frame.js"></script>
<script>
(async () => {
  const d = await SNFFL.load();
  SNFFL.chrome({ section: 'MATCHUPS', sub: '', week: d.state.scoredWeek, activeTab: 'Matchups' });

  const weeks = Array.from({ length: 17 }, (_, i) => i + 1).map((w) =>
    `<button class="snffl-week-pill ${w === d.state.scoredWeek ? 'snffl-week-pill-active' : ''}"><span>WK ${w}</span></button>`
  ).join('');

  // A result bug: angled flag, both teams, scores, margin chip, progress line.
  const bug = (g) => {
    const rows = [g.away, g.home].map((s) => {
      const t = SNFFL.team(s.rosterId);
      const won = g.winner === s.rosterId;
      return `<div class="snffl-bug-side ${won ? '' : 'snffl-bug-side-loser'}">
        ${SNFFL.avatarTag(t, 'snffl-bug-avatar')}
        <span class="snffl-bug-team">${t.teamName}</span>
        <span class="snffl-bug-score snffl-numeric">${s.points.toFixed(2)}</span>
      </div>`;
    }).join('');
    // Color never works alone, so a close game is called out in words, not a red chip.
    const close = g.margin < 10 ? ' &middot; CLOSE' : '';
    return `<section class="snffl-card">
      <div class="snffl-bug">
        <div class="snffl-bug-flag snffl-bug-flag-win">W</div>
        <div class="snffl-bug-body">
          ${rows}
          <div class="snffl-bug-meta">
            <span class="snffl-margin-chip"><span>&#9650; ${g.margin.toFixed(2)}${close}</span></span>
            <span>Final</span>
          </div>
        </div>
      </div>
    </section>`;
  };

  // Component states shown as swatches. Week 1 is final, so live and pending
  // states have no real data behind them and are labeled as samples.
  const states = `
    <div class="snffl-card">
      ${[['snffl-bug-flag-win', 'W', 'Win'],
         ['snffl-bug-flag-loss', 'L', 'Loss'],
         ['snffl-bug-flag-live', '', 'Live, in progress'],
         ['snffl-bug-flag-pending', '', 'Pending kickoff']].map(([cls, letter, label]) =>
        `<div class="snffl-bug">
          <div class="snffl-bug-flag ${cls}">${letter || (cls.includes('live') ? '<span class="snffl-live-dot"></span>' : '<i class="ph-duotone ph-clock"></i>')}</div>
          <div class="snffl-bug-body"><div class="snffl-bug-meta"><span>${label}</span></div></div>
        </div>`).join('')}
    </div>`;

  document.getElementById('snffl-matchups').innerHTML = `
    <section><div class="snffl-week-selector">${weeks}</div></section>
    <section>
      <div class="snffl-block-heading"><h2 class="snffl-headline">Week ${d.state.scoredWeek} Results</h2>
        <span class="snffl-block-heading-link">${d.games.length} games</span></div>
      <div class="snffl-matchups-grid">${d.games.map(bug).join('')}</div>
    </section>
    <section>
      <div class="snffl-block-heading"><h2 class="snffl-headline">Result Flag States</h2></div>
      ${states}
      <div class="snffl-placeholder">
        <span class="snffl-placeholder-label">Sample states</span>
        <span class="snffl-placeholder-note">Week 1 is final, so live and pending flags are shown as components, not real games.</span>
      </div>
    </section>`;
})();
</script>
</body>
</html>
