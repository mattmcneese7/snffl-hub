@keyframes snffl-drop{0%{transform:translateY(-4px) scale(.25);opacity:0}35%{transform:none;opacity:1}55%{transform:none;opacity:1}90%{transform:translateY(24px);opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.snffl-wave,.snffl-fall{animation:none}}
</style>
