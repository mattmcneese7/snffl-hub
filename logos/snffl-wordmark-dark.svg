<title id="snffl-title">SNFFL</title>
<style>
.snffl-wave{animation:snffl-wave 2.4s linear infinite}
.snffl-fall{transform-box:fill-box;transform-origin:50% 0;animation:snffl-drop 3.4s cubic-bezier(.5,0,.9,.6) infinite}
